name: clickhouse-database
version: 2.0.0
source:
  kind: git
  locator: https://github.com/sefe/dorc-terraform-modules.git
  ref: stock-modules/clickhouse-database/v2.0.0
parameters:
  - name: project
    type: String
    required: true
    description: Aiven console project the ClickHouse service lives in.
    pattern: "^[a-z0-9-]+$"
  - name: create_service
    type: Bool
    required: false
    description: Create the Aiven ClickHouse service layer as part of this deployment (the default). Set false to re-use an existing service named service_name instead.
    default: "true"
  - name: service_name
    type: String
    required: true
    description: Name of the Aiven ClickHouse service. Created by default; with create_service false it must name an existing service to re-use.
    pattern: "^[a-z0-9-]+$"
  - name: cloud_name
    type: String
    required: false
    description: Cloud the service is created on; only used when create_service is true. SEFE BYOC on Azure uksouth - non-prod custom-sefe-nprod-workload-azure-uksouth (default), prod custom-sefe-prod-workload-azure-uksouth.
    default: custom-sefe-nprod-workload-azure-uksouth
    pattern: "^[a-z0-9-]+$"
  - name: plan
    type: String
    required: false
    description: Aiven service plan for the created service; only used when create_service is true.
    default: startup-16
    pattern: "^[a-z0-9-]+$"
  - name: service_termination_protection
    type: Bool
    required: false
    description: Client-side deletion protection on the created service; only used when create_service is true. Default true.
    default: "true"
  - name: database_name
    type: String
    required: true
    description: ClickHouse database name; immutable (change forces recreation).
    pattern: "^[A-Za-z0-9_-]{1,255}$"
  - name: termination_protection
    type: Bool
    required: false
    description: Client-side deletion protection preventing Terraform from destroying the database. Default true.
    default: "true"
outputs:
  - name: database_id
    type: String
    description: ID of the ClickHouse database (project/service_name/name).
  - name: database_name
    type: String
  - name: project
    type: String
  - name: service_name
    type: String
description: ClickHouse database on an Aiven ClickHouse service. The service layer is created by this module by default (SEFE BYOC on Azure uksouth); re-using an existing service is the opt-in path via create_service false. Termination protection on by default; no credentials output. Requires an Aiven API token (AIVEN_TOKEN / TerraformAivenApiToken environment property).
tags:
  - data
  - aiven
  - clickhouse
category: Data
required_providers:
  aiven: ">= 4.1.1, < 5.0.0"
required_terraform_version: ">= 1.5.0"
owner: DOrc platform team
deprecated: false
deprecation_reason: ""

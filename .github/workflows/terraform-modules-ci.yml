name: terraform-modules-ci

# Module source now lives in https://github.com/sefe/dorc-terraform-modules
# (fmt/validate/tflint/secret-output gates run there). This workflow keeps the
# gates for what remains in this repo: the catalog manifests and the
# docs/Terraform example project.

on:
  pull_request:
    paths:
      - 'stock-modules-manifests/**'
      - 'docs/Terraform/**'
      - 'src/Tools.TerraformLint/**'
      - 'src/Dorc.Terraform.Catalog*/**'
      - '.github/workflows/terraform-modules-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'stock-modules-manifests/**'
      - 'docs/Terraform/**'
      - 'src/Tools.TerraformLint/**'
      - 'src/Dorc.Terraform.Catalog*/**'
      - '.github/workflows/terraform-modules-ci.yml'

permissions:
  contents: read

env:
  TF_VERSION: '1.7.5'

jobs:
  fmt:
    name: terraform fmt -check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive docs/Terraform/examples

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - docs/Terraform/examples/terraform-project
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init -backend=false
        working-directory: ${{ matrix.module }}
        # init -backend=false avoids needing real Azure credentials in CI;
        # provider binaries still download from the registry, and the example
        # fetches the public sefe/dorc-terraform-modules repo at a pinned tag.
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: ${{ matrix.module }}
        run: terraform validate

  manifest-immutability:
    name: manifest immutability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: '8.0.x'
      - name: build
        run: dotnet build src/Tools.TerraformLint/Tools.TerraformLint.csproj -c Release --nologo
      - name: test release retention and immutability
        run: dotnet src/Tools.TerraformLint/bin/Release/net8.0/Tools.TerraformLint.dll --self-test
      - name: enforce immutability
        # On pull requests compare against the merge base with the target
        # branch; on pushes to main compare against the previous main commit so
        # direct pushes and stale merges are re-validated where the result is
        # authoritative. A branch-creation push has an all-zeros "before" SHA;
        # fall back to the first parent in that case.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi
          dotnet src/Tools.TerraformLint/bin/Release/net8.0/Tools.TerraformLint.dll manifest-immutability "$BASE_SHA" "$HEAD_SHA"

  manifest-sensitive-name-lint:
    name: manifest sensitive-name lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          dotnet-version: '8.0.x'
      - name: build
        run: dotnet build src/Tools.TerraformLint/Tools.TerraformLint.csproj -c Release --nologo
      - name: self-test
        run: dotnet src/Tools.TerraformLint/bin/Release/net8.0/Tools.TerraformLint.dll --self-test
      - name: lint manifests
        run: dotnet src/Tools.TerraformLint/bin/Release/net8.0/Tools.TerraformLint.dll manifest-sensitive-names stock-modules-manifests/
      - name: lint manifest suggest hints
        run: dotnet src/Tools.TerraformLint/bin/Release/net8.0/Tools.TerraformLint.dll manifest-suggest-hints stock-modules-manifests/
      - name: catalog and published manifest regression tests
        run: dotnet test src/Dorc.Terraform.Catalog.Tests/Dorc.Terraform.Catalog.Tests.csproj -c Release --nologo

name: DOrc Build

on:
  # Topic branches (feature/**, fix/**, copilot/**, claude/** …) are covered by
  # the pull_request trigger below. Listing them here as well fired the entire
  # pipeline twice for every push to a branch with an open PR — two ~12 minute
  # Windows runs for a single change. Long-lived branches keep a push trigger
  # because their runs publish the artifacts consumed downstream.
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      capture_binlog:
        description: 'Capture an MSBuild binary log as an artifact (for build-time analysis)'
        type: boolean
        default: false

# Supersede in-flight runs for the same PR or branch — only the newest commit
# needs a green build. main and release/** are exempt from cancellation so a
# run that publishes artifacts is never killed part-way through.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

env:
  BUILD_PLATFORM: 'Any CPU'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_PATH: 'src/Dorc.sln'
  NODE_VERSION: '20.x'

jobs:
  # The web suite gates nothing downstream — the MSI harvests dorc-web\dist,
  # which the build job produces itself — so running it alongside the .NET
  # build takes it off the critical path entirely.
  web-tests:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/dorc-web/package-lock.json

    - name: Install web dependencies
      working-directory: src/dorc-web
      run: npm ci --loglevel=error

    - name: Select browser matrix
      id: browsers
      shell: pwsh
      run: |
        # Branches that ship get all three engines; everything else gets
        # chromium, which keeps PR feedback short and avoids downloading two
        # extra browser engines on a cache miss.
        #
        # Read the ref from the environment rather than interpolating
        # ${{ github.ref }} into the script body: ref names may contain quotes
        # and backticks, so the interpolated form is a script-injection sink.
        $ref = $env:GITHUB_REF
        if ($ref -eq "refs/heads/main" -or $ref -eq "refs/heads/develop" -or $ref -like "refs/heads/release/*") {
          $browsers = "chromium,firefox,webkit"
        } else {
          $browsers = "chromium"
        }
        Write-Host "Browser matrix: $browsers"
        echo "list=$browsers" >> $env:GITHUB_OUTPUT
        echo "install=$($browsers -replace ',',' ')" >> $env:GITHUB_OUTPUT
        # actions/cache rejects a key containing a comma, so the cache key gets
        # its own dash-separated form. Using $browsers directly worked on PRs
        # (single 'chromium', no comma) and failed the moment main built the
        # full 'chromium,firefox,webkit' matrix.
        echo "cachekey=$($browsers -replace ',','-')" >> $env:GITHUB_OUTPUT

    # The next three steps assume Windows (pwsh + the Windows cache path).
    # The whole job is windows-latest today; the `if: runner.os == 'Windows'`
    # guards align them so adding a Linux/macOS matrix entry later is a
    # localised change here rather than a silent CI mis-fire.
    - name: Get installed Playwright version
      id: playwright-version
      if: runner.os == 'Windows'
      working-directory: src/dorc-web
      shell: pwsh
      run: |
        $version = (npm ls @playwright/test --json 2>$null `
          | ConvertFrom-Json).dependencies.'@playwright/test'.version
        if (-not $version) {
          $version = (npm ls playwright --json 2>$null `
            | ConvertFrom-Json).dependencies.playwright.version
        }
        if (-not $version) {
          # Refuse to write an empty cache key — would produce
          # `playwright-Windows-` and silently match every run forever.
          Write-Error "Could not determine installed Playwright version"
          exit 1
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT

    # The browser list is part of the key: a cache populated by a chromium-only
    # run must not satisfy a run that needs all three engines.
    - name: Cache Playwright browsers
      id: playwright-cache
      if: runner.os == 'Windows'
      uses: actions/cache@v6
      with:
        path: ~\AppData\Local\ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ steps.browsers.outputs.cachekey }}

    - name: Install Playwright browsers
      if: runner.os == 'Windows' && steps.playwright-cache.outputs.cache-hit != 'true'
      working-directory: src/dorc-web
      run: npx playwright install ${{ steps.browsers.outputs.install }}

    - name: Run web tests
      if: runner.os == 'Windows'
      working-directory: src/dorc-web
      env:
        VITEST_BROWSERS: ${{ steps.browsers.outputs.list }}
      run: npm test

  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # actions/setup-dotnet is deliberately absent: the windows-latest image
    # already ships the .NET SDK, and installing a second copy cost ~38s of
    # every run. This step is near-free and makes a toolchain regression on the
    # runner image obvious in the log rather than a confusing build failure.
    - name: Report .NET toolchain
      shell: pwsh
      run: |
        dotnet --list-sdks
        dotnet --list-runtimes

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/dorc-web/package-lock.json
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      
    - name: Install WiX Toolset
      run: |
        dotnet tool install --global wix --version 6.0.1
        wix --version
        
    - name: Generate version number
      id: version
      shell: pwsh
      run: |
        $date = Get-Date -Format "yy.MM.dd"
        $patch = "${{ github.run_number }}"
        $version = "$date.$patch"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Build version: $version"
        
    - name: Install web dependencies
      working-directory: src/dorc-web
      run: npm ci --loglevel=error
      
    - name: Build web site
      working-directory: src/dorc-web
      run: npm run build

    - name: Version AssemblyInfo files
      shell: pwsh
      env:
        BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
        BUILD_BUILDNUMBER: ${{ steps.version.outputs.VERSION }}
      run: |
        $ErrorActionPreference = "Stop"
        $BuildNumber = "${{ steps.version.outputs.VERSION }}"
        $SourcesPath = "${{ github.workspace }}"
        $VersionRegex = "\d+\.\d+\.\d+\.\d+"
        
        Write-Host "BUILD_SOURCESDIRECTORY: $SourcesPath"
        Write-Host "BUILD_BUILDNUMBER: $BuildNumber"
        Write-Host "Version: $BuildNumber"
        
        $files = Get-ChildItem $SourcesPath -Recurse -Include "*Properties*","*Includes*" |
            Where-Object { $_.PSIsContainer } |
            ForEach-Object { Get-ChildItem -Path $_.FullName -Recurse -Include *AssemblyInfo.* }
        
        if ($files) {
            Write-Host "Will check $($files.count) files."
            foreach ($file in $files) {
                Write-Host "  $($file.FullName)" -NoNewline
                $filecontent = Get-Content($file)
                $versionInstances = Select-String $VersionRegex -InputObject $filecontent -AllMatches
                if ($versionInstances.Count -gt 0) {
                    attrib $file -r
                    $filecontent -replace $VersionRegex, $BuildNumber | Out-File $file
                    Write-Host " **version $BuildNumber applied**"
                } else {
                    Write-Host " No matches"
                }
            }
        } else {
            Write-Warning "Found no files."
        }
        
    - name: Version Cmdlet
      shell: pwsh
      env:
        BUILD_SOURCESDIRECTORY: ${{ github.workspace }}
        BUILD_BUILDNUMBER: ${{ steps.version.outputs.VERSION }}
      working-directory: src/Tools.DOrc.Cmdlet
      run: |
        if (Test-Path "UpdateVersion.ps1") {
          .\UpdateVersion.ps1
        } else {
          Write-Host "UpdateVersion.ps1 not found, skipping cmdlet versioning"
        }
      
    # There is deliberately no actions/cache step for ~/.nuget/packages here.
    # Caching it on Windows means shuffling tens of thousands of small files:
    # measured over run 30527995114 it cost 1m04s to restore plus 10s to save,
    # to speed up a restore that takes 27s warm. The key also hashed **/*.csproj,
    # so any project-file edit paid that cost for nothing.
    # Every project in the solution is SDK-style (csproj / wixproj / sqlproj)
    # and there is no packages.config anywhere in the tree, so the `nuget
    # restore` pass that used to run first was pure duplication of the work
    # `dotnet restore` does on the same solution.
    - name: Restore packages
      run: dotnet restore ${{ env.SOLUTION_PATH }} --configfile pipelines/NuGet.config

    # /m builds independent projects across every core on the runner and keeps
    # the Roslyn compiler server alive between them. The previous
    # `/m:1 /p:BuildInParallel=false /p:UseSharedCompilation=false` combination
    # pushed all 37 projects through a single node with a cold csc.exe start
    # each time, and accounted for over half the pipeline's wall-clock.
    # Setup.Dorc and Setup.Acceptance declare their ProjectReferences
    # explicitly, so the dependency graph still orders the MSI harvest after
    # the projects it packages.
    #
    # /bl is opt-in via workflow_dispatch rather than always-on: a binary log
    # is the tool for asking which targets dominate the remaining build time,
    # but it is not free to write and there is no reason to pay for it on every
    # run. `inputs` is empty for push/pull_request, so the flag expands to
    # nothing there.
    - name: Build solution
      run: msbuild ${{ env.SOLUTION_PATH }} /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform="${{ env.BUILD_PLATFORM }}" /p:RunWixToolsOutOfProc=true /p:Version=${{ steps.version.outputs.VERSION }} /m ${{ inputs.capture_binlog && '/bl:build.binlog' || '' }} /clp:ErrorsOnly /nologo

    - name: Upload MSBuild binary log
      if: ${{ inputs.capture_binlog }}
      uses: actions/upload-artifact@v7
      with:
        name: build-binlog-${{ steps.version.outputs.VERSION }}
        path: build.binlog
        retention-days: 7

    - name: Run tests
      shell: pwsh
      run: |
        # Create TestResults directory if it doesn't exist
        $resultsDir = "${{ github.workspace }}\TestResults"
        if (-not (Test-Path $resultsDir)) {
          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null
        }
        
        # Find test projects (plural *Tests.csproj only — singular *Test.csproj
        # picks up non-test projects like auto-generated client stubs).
        # IntegrationTests and Acceptance are excluded — they need external resources.
        $testProjects = Get-ChildItem -Path "${{ github.workspace }}\src" -Recurse -Include "*Tests.csproj" |
          Where-Object {
            $_.FullName -notmatch "IntegrationTests" -and
            $_.FullName -notmatch "Acceptance"
          }
        
        if ($testProjects.Count -gt 0) {
          Write-Host "Found $($testProjects.Count) test projects (excluding integration/acceptance tests):"
          $testProjects | ForEach-Object { Write-Host "  - $($_.FullName)" }
          
          $failedProjects = @()
          foreach ($proj in $testProjects) {
            Write-Host "`nRunning tests for: $($proj.Name)"
            dotnet test $proj.FullName --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --logger "trx" --results-directory $resultsDir
            # A non-zero exit covers both test failures and projects that never
            # ran (e.g. not built by the solution, so --no-build has no output).
            # Record these so the failure-check step cannot miss them when no
            # .trx was produced.
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::dotnet test returned exit code $LASTEXITCODE for $($proj.Name)"
              $failedProjects += $proj.Name
            }
          }
          
          if ($failedProjects.Count -gt 0) {
            Set-Content -Path (Join-Path $resultsDir "failed-projects.txt") -Value ($failedProjects -join "`n")
          }
        } else {
          Write-Host "No test projects found"
        }
      continue-on-error: true
      
    - name: Fail workflow if tests failed (main/release branches)
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
      shell: pwsh
      run: |
        $resultsDir = "${{ github.workspace }}\TestResults"
        if (-not (Test-Path $resultsDir)) {
          Write-Host "No test results directory found, skipping test failure check"
          exit 0
        }
        
        $failed = $false

        # Projects whose `dotnet test` exited non-zero (test failures, or
        # projects that failed to run/build and produced no .trx).
        $sentinel = Join-Path $resultsDir "failed-projects.txt"
        if (Test-Path $sentinel) {
          $failedProjects = Get-Content $sentinel | Where-Object { $_ -ne "" }
          if ($failedProjects) {
            Write-Host "Test run reported non-zero exit for: $($failedProjects -join ', ')"
            $failed = $true
          }
        }

        $trxFiles = Get-ChildItem -Path $resultsDir -Recurse -Include *.trx -ErrorAction SilentlyContinue
        if (-not $trxFiles) {
          if ($failed) {
            Write-Error "Test run reported failures but no .trx files were produced. Failing workflow."
            exit 1
          }
          Write-Host "No test result files found, skipping test failure check"
          exit 0
        }
        
        foreach ($file in $trxFiles) {
          [xml]$xml = Get-Content $file.FullName
          $failCount = ($xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq "Failed" }).Count
          if ($failCount -gt 0) {
            Write-Host "$($file.FullName): $failCount test(s) failed"
            $failed = $true
          }
        }
        if ($failed) {
          Write-Error "Test failures detected. Failing workflow."
          exit 1
        } else {
          Write-Host "No test failures detected."
        }
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      if: always()
      with:
        files: |
          TestResults/**/*.trx
      continue-on-error: true
      
    - name: Collect build artifacts
      shell: pwsh
      run: |
        $artifactsRoot = "${{ github.workspace }}\artifacts"
        
        # Install scripts
        $target = "$artifactsRoot"
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        Copy-Item -Path "${{ github.workspace }}\src\install-scripts\*.ps1" -Destination $target -Force -ErrorAction SilentlyContinue
        Copy-Item -Path "${{ github.workspace }}\src\install-scripts\*.json" -Destination $target -Force -ErrorAction SilentlyContinue
        Write-Host "Copied install scripts"
        
        # Database files
        $source = "${{ github.workspace }}\src\Dorc.Database\sql\${{ env.BUILD_CONFIGURATION }}"
        $target = "$artifactsRoot\Database"
        if (Test-Path $source) {
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$source\*.dacpac" -Destination $target -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$source\*.sql" -Destination $target -Force -ErrorAction SilentlyContinue
          Write-Host "Copied database files"
        }
        
        # MSI installers
        $target = "$artifactsRoot\Server"
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        
        $source = "${{ github.workspace }}\src\Setup.Dorc\bin\x64\${{ env.BUILD_CONFIGURATION }}"
        if (Test-Path $source) {
          Copy-Item -Path "$source\*.msi" -Destination $target -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$source\*.json" -Destination $target -Force -ErrorAction SilentlyContinue
          Write-Host "Copied DOrc MSI installer"
        }
        
        $source = "${{ github.workspace }}\src\Setup.Acceptance\bin\x64\${{ env.BUILD_CONFIGURATION }}"
        if (Test-Path $source) {
          Copy-Item -Path "$source\*.msi" -Destination $target -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$source\*.json" -Destination $target -Force -ErrorAction SilentlyContinue
          Write-Host "Copied Test Acceptance MSI installer"
        }
        
        # PowerShell Cmdlet
        $source = "${{ github.workspace }}\src\Tools.DOrc.Cmdlet"
        $target = "$artifactsRoot\DOrc.Cmdlet"
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        Copy-Item -Path "$source\*.ps1" -Destination $target -Force -ErrorAction SilentlyContinue
        Copy-Item -Path "$source\*.psm1" -Destination $target -Force -ErrorAction SilentlyContinue
        Copy-Item -Path "$source\*.psd1" -Destination $target -Force -ErrorAction SilentlyContinue
        Write-Host "Copied PowerShell Cmdlet"
        
    - name: Set artifact retention period
      id: set_retention
      shell: pwsh
      run: |
        # Same reasoning as 'Select browser matrix': read the ref from the
        # environment instead of interpolating it into the script body.
        $ref = $env:GITHUB_REF
        if ($ref -eq "refs/heads/main" -or $ref -like "refs/heads/release/*") {
          echo "RETENTION_DAYS=400" >> $env:GITHUB_ENV
        } else {
          echo "RETENTION_DAYS=14" >> $env:GITHUB_ENV
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dorc-release-${{ steps.version.outputs.VERSION }}
        path: artifacts/
        retention-days: ${{ env.RETENTION_DAYS }}

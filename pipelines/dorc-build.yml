name: $(Build.DefinitionName).$(Build.SourceBranchName)_$(Date:yy).$(Date:MM).$(Date:dd)$(rev:.r)

trigger:
- main
- develop
- release/*
- feature/*
- fix/*
- hotfix/*
- migration/*
- copilot/*

pool:
  name: TRADING-DOTNET-03
  demands:
  - DotNetFramework
  - node.js
  - msbuild
  - visualstudio
  - vstest

variables:
- name: buildPlatform
  value: "Any CPU"
- name: buildConfiguration
  value: "Release"
- name: DropFolder
  value: '\\appinst01\tfsbdev01lonuk_drops\'
- name: solution
  value: 'src/Dorc.sln'
- name: testProjects
  value: 'src/**/*[Tt]ests.csproj'
- name: version.Date
  value: $[format('{0:yy}.{0:MM}.{0:dd}', pipeline.startTime)]
- name: version.Patch
  value: $[counter(variables['version.Date'], 0)]
- name: version
  value: '$(version.Date).$(version.Patch)'
# Path to the drop containing the single-package baseline MSI. Empty here so
# the macro always expands; setting it in the pipeline's variables arms the G-1
# comparison in 'Verify Installer Tables'. The harness self-test runs either
# way.
- name: MsiBaselinePath
  value: ''
- group: 'BuildTimeTests'

steps:
- task: Npm@1
  displayName: 'install web dependencies'
  inputs:
    command: install
    workingDir: 'src/dorc-web'
    verbose: true

- task: Npm@1
  displayName: 'Build Web Site'
  inputs:
    command: custom
    workingDir: 'src/dorc-web'
    verbose: true
    customCommand: 'run build'

- task: PowerShell@1
  displayName: 'Version AssemblyInfo Files'
  inputs:
    scriptName: '$(Build.SourcesDirectory)\pipelines\ApplyVersionToAssemblies.ps1'

- task: PowerShell@1
  displayName: 'Version Cmdlet'
  inputs:
    scriptType: 'filePath'
    scriptName: '$(Build.SourcesDirectory)\src\Tools.DOrc.Cmdlet\UpdateVersion.ps1'

# Every project in the solution is SDK-style (csproj / wixproj / sqlproj) and
# there is no packages.config anywhere in the tree, so the separate 'NuGet
# restore' task that used to run here duplicated this one.
# noCache was forcing all 124 unique packages to be re-downloaded from the feed
# on every build, defeating the agent's local package cache.
- task: DotNetCoreCLI@2
  displayName: 'Restore Packages'
  inputs:
      command: 'restore'
      projects: $(solution)
      feedsToUse: 'config'
      nugetConfigPath: 'pipelines\NuGet.config'

- task: sonarsource.sonarqube.15B84CA1-B62F-4A2A-A403-89B77A063157.SonarQubePrepare@6.3.2
  displayName: 'Prepare the SonarQube analysis'
  inputs:
    SonarQube: SonarQube
    projectKey: sh.devops.dorc
    projectName: sh.devops.dorc
    projectVersion: '$(Build.BuildNumber)'
    extraProperties: |
      sonar.sources=src/dorc-web
      sonar.exclusions=src/dorc-web/.gitignore
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/develop'),eq(variables['Build.Reason'], 'PullRequest')))

- task: FileTransform@2
  displayName: 'Transform settings for tests during build time'
  inputs:
    folderPath: '$(System.DefaultWorkingDirectory)/src/Dorc.Monitor.IntegrationTests'
    enableXmlTransform: false
    xmlTransformationRules: ''
    jsonTargetFiles: 'appsettings.test.json'

# Materialise the directories the installers harvest, before anything else
# builds. SDK-style projects are not directly packageable — the deployable
# layout only exists after Publish has run, and for Dorc.Api that includes
# web.config, which IIS needs and which does not exist in source.
#
# This used to happen inside the wixprojs via <Exec>, spawning child processes
# the parent MSBuild could not see or deduplicate; under a parallel build the
# two wixprojs ran their chains concurrently and raced the outer build for the
# same intermediate outputs (CS2012). Running it here, as one MSBuild
# invocation over the whole payload list, means a single engine owns the graph
# and the shared dependencies are built exactly once.
- task: MSBuild@1
  displayName: 'Publish Installer Payload'
  inputs:
    solution: 'src/InstallerPayload.proj'
    configuration: '$(BuildConfiguration)'
    maximumCpuCount: true

# maximumCpuCount is safe here only because the payload above is already on
# disk and DorcPayloadPrepublished=true switches off the wixprojs' in-build
# Exec chains. Removing either of those brings back the CS2012 race that took
# main red on GitHub run 30812109885 — do not enable it without both.
#
# 'clean' stays off: it was forcing a full rebuild on every run of a persistent
# self-hosted agent, discarding all incremental build state. That is unrelated
# to the parallelism problem above.
- task: VSBuild@1
  displayName: 'Build solution **\*.sln'
  inputs:
      solution: $(solution)
      msbuildArgs: '/p:RunWixToolsOutOfProc=true,Version=$(version) /p:DorcPayloadPrepublished=true'
      platform: '$(BuildPlatform)'
      configuration: '$(BuildConfiguration)'
      maximumCpuCount: true

# runInParallel / codeCoverageEnabled / diagnosticsEnabled used to sit inside
# the testAssemblyVer2 block scalar, so they were parsed as test-assembly glob
# patterns rather than task inputs and had never taken effect — tests have been
# running serially with no coverage collected. Parallel execution and coverage
# are promoted to real inputs here; diagnosticsEnabled is dropped rather than
# switched on, since it collects per-test diagnostic data at a real cost and
# nothing has ever consumed it.
- task: VSTest@2
  displayName: 'Test Assemblies **\*tests.dll;-:**\obj\**'
  inputs:
    testAssemblyVer2: |
      **\*tests.dll
      !**\obj\**
      !**\IntegrationTests\**
    runInParallel: true
    codeCoverageEnabled: true
  continueOnError: true
  
- task: sonarsource.sonarqube.6D01813A-9589-4B15-8491-8164AEB38055.SonarQubeAnalyze@6.3.2
  displayName: 'Complete the SonarQube analysis'
  continueOnError: true
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/develop'),eq(variables['Build.Reason'], 'PullRequest')))

- task: richardfennellbm.BM-VSTS-FileCopier-Tasks.FileCopyTask.FileCopy@4
  displayName: 'Copy Install Scripts'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)\src\install-scripts'
    targetFolder: '$(Build.ArtifactStagingDirectory)'
    include: '*.ps1,*.json'

- task: richardfennellbm.BM-VSTS-FileCopier-Tasks.FileCopyTask.FileCopy@4
  displayName: 'Copy Database Files'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)\src\Dorc.Database\sql\$(BuildConfiguration)'
    targetFolder: '$(Build.ArtifactStagingDirectory)\Database'
    include: '*.dacpac,*.sql'

- task: richardfennellbm.BM-VSTS-FileCopier-Tasks.FileCopyTask.FileCopy@4
  displayName: 'Copy DOrc MSI Installer'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)\src\Setup.Dorc\bin\x64\$(BuildConfiguration)'
    targetFolder: '$(Build.ArtifactStagingDirectory)\Server'
    include: '*.msi,*.json'

- task: richardfennellbm.BM-VSTS-FileCopier-Tasks.FileCopyTask.FileCopy@4
  displayName: 'Copy DOrc CLI MSI Installer'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)\src\Setup.Dorc.Cli\bin\x64\$(BuildConfiguration)'
    targetFolder: '$(Build.ArtifactStagingDirectory)\Server'
    include: '*.msi,*.json'

- task: richardfennellbm.BM-VSTS-FileCopier-Tasks.FileCopyTask.FileCopy@4
  displayName: 'Copy Test Acceptance MSI Installer'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)\src\Setup.Acceptance\bin\x64\$(BuildConfiguration)'
    targetFolder: '$(Build.ArtifactStagingDirectory)\Server'
    include: '*.msi,*.json'

- task: richardfennellbm.BM-VSTS-FileCopier-Tasks.FileCopyTask.FileCopy@4
  displayName: 'Copy PowerShell Cmdlet'
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)\src\Tools.DOrc.Cmdlet'
    targetFolder: '$(Build.ArtifactStagingDirectory)\DOrc.Cmdlet'
    include: '*.ps1,*.psm1,*.psd1'

# G-1 gate for the installer decomposition (docs/msi-decomposition/). Mirrors
# the GitHub Actions step: the harness self-test runs on every build, and the
# baseline comparison runs when MsiBaselinePath points at the drop folder of
# the single-package baseline build. Setting that variable is what arms it.
- task: PowerShell@2
  displayName: 'Verify Installer Tables'
  inputs:
    targetType: filePath
    filePath: '$(Build.SourcesDirectory)\tools\msi-table-diff\Verify-InstallerTables.ps1'
    arguments: '-PackageFolder "$(Build.ArtifactStagingDirectory)\Server" -BaselinePath "$(MsiBaselinePath)"'
    failOnStderr: false

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  inputs:
    publishLocation: FilePath
    ArtifactName: drop
    TargetPath: '$(DropFolder)$(Build.DefinitionName)\$(Build.BuildNumber)'
